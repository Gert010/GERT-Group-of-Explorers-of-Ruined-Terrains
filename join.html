<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вступить в GERT</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    max-width:700px;
    margin:auto;
    padding:40px;
    line-height:1.8;
}

a{
    color:white;
    text-decoration:none;
}

h1{
    border-bottom:2px solid #444;
    padding-bottom:10px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0 20px 0;
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:6px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    background:#333;
    color:white;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#555;
}

.counter{
    margin-top:40px;
    text-align:center;
    font-size:22px;
    border-top:1px solid #444;
    padding-top:20px;
}

.notice{
    margin-top:20px;
    color:#8cff8c;
    text-align:center;
}

</style>

</head>

<body>

<a href="index.html">← Назад</a>

<h1>Вступление в движение GERT</h1>

<p>
Если вы разделяете идеи GERT, соблюдаете Кодекс и готовы исследовать мир
ответственно и с уважением — подайте заявку на вступление.
</p>

<form onsubmit="join(event)">

<label>Позывной</label>
<input type="text" placeholder="Введите позывной" required>

<label>E-mail</label>
<input type="email" placeholder="Введите почту" required>

<label>
<input type="checkbox" required>
Я ознакомился с Манифестом и Кодексом GERT.
</label>

<button type="submit">Вступить в GERT</button>

</form>

<p class="notice" id="msg"></p>

<div class="counter">

👥 Гертовцев

<h2 id="count">17</h2>

</div>

<script type="module" src="js/join.js"></script>
    
</body>
</html>
